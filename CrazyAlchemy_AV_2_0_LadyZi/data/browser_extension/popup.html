<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Crazy Alchemy Shields</title>
    <style>
        body {
            width: 320px;
            background-color: #121820;
            color: #e6edf3;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 16px;
            user-select: none;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #21262d;
            padding-bottom: 12px;
            margin-bottom: 12px;
        }
        .title {
            font-size: 14px;
            font-weight: bold;
            color: #58a6ff;
        }
        .pill {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 12px;
            background-color: #1e3a2f;
            color: #81c784;
            font-weight: bold;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }
        .stat-card {
            background-color: #1a222d;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
        }
        .stat-num {
            font-size: 20px;
            font-weight: bold;
            color: #388bfd;
        }
        .stat-lbl {
            font-size: 11px;
            color: #8b949e;
            margin-top: 2px;
        }
        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 13px;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 34px;
            height: 18px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #30363d; transition: .3s; border-radius: 18px;
        }
        .slider:before {
            position: absolute; content: ""; height: 12px; width: 12px; left: 3px; bottom: 3px;
            background-color: white; transition: .3s; border-radius: 50%;
        }
        input:checked + .slider { background-color: #238636; }
        input:checked + .slider:before { transform: translateX(16px); }
        .footer {
            border-top: 1px solid #21262d;
            padding-top: 10px;
            margin-top: 12px;
            text-align: center;
            font-size: 11px;
            color: #6e7681;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">🛡️ Crazy Alchemy Web Shield</div>
        <div class="pill" id="status-pill">Active</div>
    </div>
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-num" id="stat-threats">0</div>
            <div class="stat-lbl">Threats Blocked</div>
        </div>
        <div class="stat-card">
            <div class="stat-num" id="stat-ads">0</div>
            <div class="stat-lbl">Ads & Trackers</div>
        </div>
    </div>
    <div class="row">
        <span>Malware & Phishing Defense</span>
        <label class="switch">
            <input type="checkbox" id="chk-malware" checked>
            <span class="slider"></span>
        </label>
    </div>
    <div class="row">
        <span>Crazy-Style Ad & Tracker Blocker</span>
        <label class="switch">
            <input type="checkbox" id="chk-adblock" checked>
            <span class="slider"></span>
        </label>
    </div>
    <div class="row">
        <span>Anti-Cryptojacking Shield</span>
        <label class="switch">
            <input type="checkbox" id="chk-miner" checked>
            <span class="slider"></span>
        </label>
    </div>
    <div class="footer">
        Crazy Alchemy v2.0 (LadyZi) Desktop Suite
    </div>
    <script src="popup.js"></script>
</body>
</html>
