<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Threat Intercepted - Crazy Alchemy Shield</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .card {
            background-color: #161b22;
            border: 1px solid #f85149;
            border-radius: 12px;
            padding: 36px 40px;
            max-width: 580px;
            box-shadow: 0 16px 40px rgba(0,0,0,0.6);
            text-align: center;
        }
        .icon {
            font-size: 56px;
            margin-bottom: 12px;
        }
        h1 {
            color: #ff7b72;
            font-size: 24px;
            margin: 0 0 10px 0;
        }
        p {
            font-size: 14px;
            color: #8b949e;
            line-height: 1.6;
        }
        .url-box {
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 10px;
            font-family: monospace;
            font-size: 13px;
            color: #e6edf3;
            word-break: break-all;
            margin: 18px 0;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 24px;
        }
        button {
            padding: 10px 20px;
            border-radius: 6px;
            border: none;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-primary {
            background-color: #238636;
            color: white;
        }
        .btn-secondary {
            background-color: #21262d;
            color: #8b949e;
            border: 1px solid #30363d;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🛡️⚠️</div>
        <h1>Dangerous Website Blocked</h1>
        <p>Crazy Alchemy Web Shield & Antivirus prevented this connection because the target domain was identified as harboring malware, phishing, or crypto-stealing scripts.</p>
        <div class="url-box" id="target-url">Blocked URL Loading...</div>
        <div class="btn-group">
            <button class="btn-primary" onclick="history.back()">Back to Safety (Recommended)</button>
            <button class="btn-secondary" onclick="window.close()">Close Tab</button>
        </div>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const url = params.get('url') || 'Unknown URL';
        document.getElementById('target-url').textContent = url;
    </script>
</body>
</html>
